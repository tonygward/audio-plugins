name: Notify Matrix backlog
on:
  push:
    branches: [main]
    paths: ['**/prompts/**']
permissions: {}
concurrency:
  group: matrix-notification
  cancel-in-progress: false
jobs:
  notify:
    # Owner must create/approve this environment and restrict its runner group
    # to THIS workflow on main. No PR event, checkout, secrets or prompt execution.
    if: github.repository == 'tonygward/audio-plugins' && vars.MATRIX_NOTIFY_ENABLED == 'true'
    environment: matrix-notification
    runs-on: [self-hosted, Windows, matrix-notify]
    timeout-minutes: 2
    steps:
      - name: Signal installed trusted notifier
        shell: pwsh
        env:
          MATRIX_REVISION: ${{ github.sha }}
        run: '& C:\Matrix\trusted\Notify-Matrix.ps1 -Revision $env:MATRIX_REVISION'
