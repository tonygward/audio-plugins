name: CI - Build and test

# Two builds per release: a pull request builds only the plugins it changed, and one packaging build (everything, plus both installers) runs on
# the version bump commit, which the release files come from. A plain merge to main builds nothing: see scripts/release/plan.mjs.
# Branches without a PR can be built by hand from the Actions tab (workflow_dispatch).
# macOS builds are universal (Apple Silicon and Intel) on main and manual runs, which
# is what the release installers come from. Pull requests build Apple Silicon only
# (arm64), which halves the compile time; an Intel-only compile problem would show
# up on main instead of in the pull request.
#
# Only source changes build: a change has to touch a file in one of the folders
# below that isn't a doc, prompt or image (the "!" lines). Docs, READMEs,
# prompts and screenshots alone never start a build. Keep both lists the same;
# add a folder here when you add a plugin.
#
# A pull request then builds only the plugins it changes (the "changes" job
# below): a change under eq/ builds the EQ only, and so on. A change to anything
# shared (shared/, installer/, VERSION, the workflow or .gitattributes) builds
# every plugin and both suite installers. Merges to main and manual runs always
# build everything, so the release files always come from a full build.
on:
  push:
    branches: [main]
    paths:
      - 'eq/**'
      - 'analog-compressor/**'
      - 'maximiser/**'
      - 'shared/**'
      - 'installer/**'
      - 'VERSION'
      - '.github/workflows/**'
      - '.gitattributes'
      - '!**.md'
      - '!**.png'
      - '!**/prompts/**'
      - '!**/docs/**'
      - '!**/.gitignore'
  pull_request:
    paths:
      - 'eq/**'
      - 'analog-compressor/**'
      - 'maximiser/**'
      - 'shared/**'
      - 'installer/**'
      - 'VERSION'
      - '.github/workflows/**'
      - '.gitattributes'
      - '!**.md'
      - '!**.png'
      - '!**/prompts/**'
      - '!**/docs/**'
      - '!**/.gitignore'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # A new push to a PR replaces its running build; builds of main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with the JUCE version the project is developed against (see README).
  JUCE_VERSION: "9.0.5"

jobs:
  # Which plugins does this change affect? Decided by the files changed, never by hand.
  changes:
    name: Choose what to build
    runs-on: ubuntu-latest
    outputs:
      eq: ${{ steps.pick.outputs.eq }}
      analog-compressor: ${{ steps.pick.outputs.analog-compressor }}
      maximiser: ${{ steps.pick.outputs.maximiser }}
      suite: ${{ steps.pick.outputs.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Work out which plugins changed
        id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BUMP_ENABLED: ${{ vars.AUTO_BETA_VERSION_ENABLED }}
        run: |
          set -euo pipefail
          eq=false; analog=false; max=false; all=false
          if [ "$EVENT" = "push" ]; then
            # Two builds per release: this pull request's changed plugins were built when it was reviewed, and the version bump follows the merge.
            # So a plain source merge builds nothing; the bump commit is the one packaging build (everything, plus both installers) the release is made from.
            # scripts/release/plan.mjs decides; anything uncertain builds.
            # Only an explicit "build=false" skips; if the planner fails for any reason the push builds.
            plan=$(mktemp); GITHUB_OUTPUT="$plan" node scripts/release/plan.mjs || true
            if ! grep -q '^build=false$' "$plan"; then all=true; fi
          elif [ "$EVENT" != "pull_request" ]; then
            all=true   # manual runs build everything
          else
            files=$(git diff --name-only "$BASE...$HEAD" | grep -v -E '\.md$|\.png$|/prompts/|/docs/|\.gitignore$' || true)
            echo "Changed source files:"; echo "$files"
            if echo "$files" | grep -q -E '^(shared/|installer/|\.github/|\.gitattributes$|VERSION$)'; then all=true; fi
            if echo "$files" | grep -q '^eq/'; then eq=true; fi
            if echo "$files" | grep -q '^analog-compressor/'; then analog=true; fi
            if echo "$files" | grep -q '^maximiser/'; then max=true; fi
            # Anything unexpected at the top level: build everything rather than guess.
            if [ -n "$files" ] && echo "$files" | grep -q -v -E '^(eq/|analog-compressor/|maximiser/|shared/|installer/|\.github/|\.gitattributes$|VERSION$)'; then all=true; fi
          fi
          if [ "$all" = true ]; then eq=true; analog=true; max=true; fi
          { echo "eq=$eq"; echo "analog-compressor=$analog"; echo "maximiser=$max"; echo "suite=$all"; } | tee -a "$GITHUB_OUTPUT"

  version:
    name: One version number
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No file holds its own version
        shell: pwsh
        run: ./installer/check-version.ps1

  eq:
    name: EQ - ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.eq == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (VS, x64)
            os: windows-latest
            configure: -A x64
            tests: eq/build/EQTests_artefacts/Release/EQTests.exe
          - name: macOS (Xcode, ${{ github.event_name == 'pull_request' && 'arm64' || 'universal' }})
            os: macos-latest
            configure: -G Xcode -DCMAKE_OSX_ARCHITECTURES="${{ github.event_name == 'pull_request' && 'arm64' || 'arm64;x86_64' }}"
            tests: eq/build/EQTests_artefacts/Release/EQTests

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE ${{ env.JUCE_VERSION }}
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_VERSION }}-${{ runner.os }}

      - name: Check out JUCE ${{ env.JUCE_VERSION }}
        if: steps.juce-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_VERSION }}
          path: JUCE

      - name: Configure
        shell: bash
        run: cmake -S eq -B eq/build ${{ matrix.configure }} -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build (Release)
        shell: bash
        run: cmake --build eq/build --config Release --parallel 4

      - name: Check the build reports the shared version
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./installer/check-version.ps1 -Built -Plugin eq

      - name: Run EQTests
        shell: bash
        run: ${{ matrix.tests }}

      # Editor screenshots rendered by EQTests (same component the plug-ins show), at 1x and
      # at 2x (Retina on macOS), so UI changes can be checked on both platforms.
      - name: Render editor screenshots
        shell: bash
        run: |
          ${{ matrix.tests }} --screenshots screenshots
          ${{ matrix.tests }} --screenshots screenshots --scale 2

      - name: Upload editor screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-EQ-screenshots-${{ runner.os }}
          path: screenshots/*.png

      # Unsigned Inno Setup installer + the manual-install zip, built from this run's Release
      # build and tested end to end (per-user, into a temp folder). Releases stay manual:
      # attach both artifacts to the GitHub release.
      - name: Build and test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          $setup = eq/installer/build-installer.ps1 -Zip | Select-Object -Last 1
          eq/installer/test-installer.ps1 -Installer $setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-EQ-Windows-setup
          path: eq/build/installer/*-win64-setup.exe

      - name: Upload Windows zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-EQ-Windows-zip
          path: eq/build/installer/*-win64.zip

      - name: Validate the Audio Unit (auval)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/"Songsmith EQ.component"
          cp -R eq/build/SongsmithEQ_artefacts/Release/AU/"Songsmith EQ.component" ~/Library/Audio/Plug-Ins/Components/
          # Make the component registrar pick up the new plug-in.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -a | grep -i "Tnyw" || true
          auval -v aufx Eq3b Tnyw

      - name: Zip macOS plug-ins (VST3 + AU)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Same version as the Windows files: the one version in VERSION.
          version=$(tr -d '[:space:]' < VERSION)
          mkdir -p dist/"Songsmith EQ"
          cp -R eq/build/SongsmithEQ_artefacts/Release/VST3/"Songsmith EQ.vst3" dist/"Songsmith EQ"/
          cp -R eq/build/SongsmithEQ_artefacts/Release/AU/"Songsmith EQ.component" dist/"Songsmith EQ"/
          ditto -c -k --keepParent dist/"Songsmith EQ" "dist/Songsmith-EQ-$version-macOS.zip"

      - name: Upload macOS zip
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-EQ-macOS-zip
          path: dist/Songsmith-EQ-*-macOS.zip

      # Unsigned .pkg (pkgbuild + productbuild), built from this run's Release build and tested
      # end to end: the runner is a throwaway machine, so the test installs system-wide for real,
      # runs auval on the installed component, upgrades, deselects the app and uninstalls.
      - name: Build and test the macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pkg=$(eq/installer/macos/build-installer.sh | tail -n 1)
          eq/installer/macos/test-installer.sh --pkg "$pkg"

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-EQ-macOS-pkg
          path: eq/build/installer/*-macOS.pkg

      - name: Upload plugin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-EQ-${{ runner.os }}
          if-no-files-found: warn
          path: |
            eq/build/SongsmithEQ_artefacts/Release/VST3/
            eq/build/SongsmithEQ_artefacts/Release/AU/
            eq/build/SongsmithEQ_artefacts/Release/Standalone/

  # Songsmith Analog Compressor (analog-compressor/): its own build and tests, independent of the EQ job.
  analog-compressor:
    name: Analog Compressor - ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.analog-compressor == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (VS, x64)
            os: windows-latest
            configure: -A x64
            tests: analog-compressor/build/AnalogCompressorTests_artefacts/Release/AnalogCompressorTests.exe
          - name: macOS (Xcode, ${{ github.event_name == 'pull_request' && 'arm64' || 'universal' }})
            os: macos-latest
            configure: -G Xcode -DCMAKE_OSX_ARCHITECTURES="${{ github.event_name == 'pull_request' && 'arm64' || 'arm64;x86_64' }}"
            tests: analog-compressor/build/AnalogCompressorTests_artefacts/Release/AnalogCompressorTests

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE ${{ env.JUCE_VERSION }}
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_VERSION }}-${{ runner.os }}

      - name: Check out JUCE ${{ env.JUCE_VERSION }}
        if: steps.juce-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_VERSION }}
          path: JUCE

      - name: Configure
        shell: bash
        run: cmake -S analog-compressor -B analog-compressor/build ${{ matrix.configure }} -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build (Release)
        shell: bash
        run: cmake --build analog-compressor/build --config Release --parallel 4

      - name: Check the build reports the shared version
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./installer/check-version.ps1 -Built -Plugin analog-compressor

      - name: Run AnalogCompressorTests
        shell: bash
        run: ${{ matrix.tests }}

      - name: Render analog compressor screenshots
        shell: bash
        run: |
          ${{ matrix.tests }} --screenshots analog-compressor-screenshots
          ${{ matrix.tests }} --screenshots analog-compressor-screenshots --scale 2

      - name: Upload analog compressor screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-Analog-Compressor-screenshots-${{ runner.os }}
          path: analog-compressor-screenshots/*.png

      # Separately named release files for the compressor, built and tested exactly like the
      # EQ's (isolated install, upgrade and uninstall; Songsmith EQ and presets must survive).
      - name: Build and test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          $setup = analog-compressor/installer/build-installer.ps1 -Zip | Select-Object -Last 1
          analog-compressor/installer/test-installer.ps1 -Installer $setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-Analog-Compressor-Windows-setup
          path: analog-compressor/build/installer/*-win64-setup.exe

      - name: Upload Windows zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-Analog-Compressor-Windows-zip
          path: analog-compressor/build/installer/*-win64.zip

      - name: Validate the Audio Unit (auval, new identifiers)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/"Songsmith Analog Compressor.component"
          cp -R analog-compressor/build/SongsmithAnalogCompressor_artefacts/Release/AU/"Songsmith Analog Compressor.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -a | grep -i "Tnyw" || true
          auval -v aufx Sfc1 Tnyw

      - name: Zip macOS plug-ins (VST3 + AU + Standalone)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          art=analog-compressor/build/SongsmithAnalogCompressor_artefacts/Release
          mkdir -p analog-compressor-dist/"Songsmith Analog Compressor"
          cp -R "$art/VST3/Songsmith Analog Compressor.vst3" "$art/AU/Songsmith Analog Compressor.component" \
                "$art/Standalone/Songsmith Analog Compressor.app" analog-compressor-dist/"Songsmith Analog Compressor"/
          ditto -c -k --keepParent analog-compressor-dist/"Songsmith Analog Compressor" "analog-compressor-dist/Songsmith-Analog-Compressor-$version-macOS.zip"

      - name: Upload macOS zip
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-Analog-Compressor-macOS-zip
          path: analog-compressor-dist/Songsmith-Analog-Compressor-*-macOS.zip

      - name: Build and test the macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pkg=$(analog-compressor/installer/macos/build-installer.sh | tail -n 1)
          analog-compressor/installer/macos/test-installer.sh --pkg "$pkg"

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-Analog-Compressor-macOS-pkg
          path: analog-compressor/build/installer/*-macOS.pkg

      - name: Upload plugin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-Analog-Compressor-${{ runner.os }}
          if-no-files-found: warn
          path: |
            analog-compressor/build/SongsmithAnalogCompressor_artefacts/Release/VST3/
            analog-compressor/build/SongsmithAnalogCompressor_artefacts/Release/AU/
            analog-compressor/build/SongsmithAnalogCompressor_artefacts/Release/Standalone/

  # Songsmith Maximiser (maximiser/): its own job, so the EQ job above stays as it is.
  maximiser:
    name: Maximiser - ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.maximiser == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (VS, x64)
            os: windows-latest
            configure: -A x64
            tests: maximiser/build/MaximiserTests_artefacts/Release/MaximiserTests.exe
          - name: macOS (Xcode, ${{ github.event_name == 'pull_request' && 'arm64' || 'universal' }})
            os: macos-latest
            configure: -G Xcode -DCMAKE_OSX_ARCHITECTURES="${{ github.event_name == 'pull_request' && 'arm64' || 'arm64;x86_64' }}"
            tests: maximiser/build/MaximiserTests_artefacts/Release/MaximiserTests

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE ${{ env.JUCE_VERSION }}
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_VERSION }}-${{ runner.os }}

      - name: Check out JUCE ${{ env.JUCE_VERSION }}
        if: steps.juce-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_VERSION }}
          path: JUCE

      - name: Configure
        shell: bash
        run: cmake -S maximiser -B maximiser/build ${{ matrix.configure }} -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build (Release)
        shell: bash
        run: cmake --build maximiser/build --config Release --parallel 4

      - name: Check the build reports the shared version
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./installer/check-version.ps1 -Built -Plugin maximiser

      # Unit tests, the randomised limiter stress tests and the auto-release comparison.
      - name: Run MaximiserTests
        shell: bash
        run: ${{ matrix.tests }}

      - name: Render editor screenshots
        shell: bash
        run: |
          mkdir -p screenshots
          ${{ matrix.tests }} --screenshot screenshots/maximiser-1x.png
          ${{ matrix.tests }} --screenshot screenshots/maximiser-2x.png --scale 2

      - name: Upload editor screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-Maximiser-screenshots-${{ runner.os }}
          path: screenshots/*.png

      - name: Validate the Audio Unit (auval)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/"Songsmith Maximiser.component"
          cp -R maximiser/build/SongsmithMaximiser_artefacts/Release/AU/"Songsmith Maximiser.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -a | grep -i "Tnyw" || true
          auval -v aufx Mxlm Tnyw

      # Unsigned Inno Setup installer + the manual-install zip, built from this run's Release build
      # and tested end to end (per-user, into a temp folder). Publishing stays manual.
      - name: Build and test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          $setup = maximiser/installer/build-installer.ps1 -Zip | Select-Object -Last 1
          maximiser/installer/test-installer.ps1 -Installer $setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-Maximiser-Windows-setup
          path: maximiser/build/installer/*-win64-setup.exe

      - name: Upload Windows zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-Maximiser-Windows-zip
          path: maximiser/build/installer/*-win64.zip

      - name: Zip macOS plug-ins (VST3 + AU)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          mkdir -p dist/"Songsmith Maximiser"
          cp -R maximiser/build/SongsmithMaximiser_artefacts/Release/VST3/"Songsmith Maximiser.vst3" dist/"Songsmith Maximiser"/
          cp -R maximiser/build/SongsmithMaximiser_artefacts/Release/AU/"Songsmith Maximiser.component" dist/"Songsmith Maximiser"/
          ditto -c -k --keepParent dist/"Songsmith Maximiser" "dist/Songsmith-Maximiser-$version-macOS.zip"

      - name: Upload macOS zip
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-Maximiser-macOS-zip
          path: dist/Songsmith-Maximiser-*-macOS.zip

      # Unsigned .pkg, built and tested end to end on the throwaway runner: installs system-wide,
      # runs auval on the installed component, reinstalls, deselects the app and uninstalls.
      - name: Build and test the macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pkg=$(maximiser/installer/macos/build-installer.sh | tail -n 1)
          maximiser/installer/macos/test-installer.sh --pkg "$pkg"

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-Maximiser-macOS-pkg
          path: maximiser/build/installer/*-macOS.pkg

      - name: Upload plugin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-Maximiser-${{ runner.os }}
          if-no-files-found: warn
          path: |
            maximiser/build/SongsmithMaximiser_artefacts/Release/VST3/
            maximiser/build/SongsmithMaximiser_artefacts/Release/AU/
            maximiser/build/SongsmithMaximiser_artefacts/Release/Standalone/

  # Songsmith Plugins: one Windows installer with every plugin (installer/windows). Built from the
  # Release builds the three plugin jobs upload, then tested end to end (per-user, in a temp
  # folder), including replacing Songsmith EQ's own installer. (needs: waits for each job's
  # macOS leg too; a job's matrix legs can't be waited for separately.)
  suite-windows:
    name: Songsmith Plugins installer - Windows
    needs: [changes, eq, analog-compressor, maximiser]
    if: needs.changes.outputs.suite == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Songsmith EQ (Windows build)
        uses: actions/download-artifact@v4
        with:
          name: Songsmith-EQ-Windows
          path: suite/eq

      - name: Download Songsmith Analog Compressor (Windows build)
        uses: actions/download-artifact@v4
        with:
          name: Songsmith-Analog-Compressor-Windows
          path: suite/fet

      - name: Download Songsmith Maximiser (Windows build)
        uses: actions/download-artifact@v4
        with:
          name: Songsmith-Maximiser-Windows
          path: suite/max

      - name: Download Songsmith EQ's own installer
        uses: actions/download-artifact@v4
        with:
          name: Songsmith-EQ-Windows-setup
          path: suite/eq-setup

      - name: Build and test the suite installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          $builds = @{ EqDir = "suite/eq"; FetDir = "suite/fet"; MaxDir = "suite/max" }
          $setup = installer/windows/build-installer.ps1 @builds | Select-Object -Last 1
          $eqSetup = (Get-ChildItem suite/eq-setup/*-win64-setup.exe | Select-Object -First 1).FullName
          installer/windows/test-installer.ps1 -Installer $setup -EqInstaller $eqSetup @builds
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the suite installer
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-Plugins-Windows-setup
          path: build/suite-installer/*-win64-setup.exe

  # Songsmith Plugins: one macOS installer with every plugin (installer/macos). Made from the same
  # component packages as each plugin's own .pkg (the macOS legs above upload those), then
  # installed system-wide on this throwaway runner and tested, with auval for each Audio Unit.
  # (needs: waits for the Windows legs too; a job's matrix legs can't be waited for separately.)
  suite-macos:
    name: Songsmith Plugins installer - macOS
    needs: [changes, eq, analog-compressor, maximiser]
    if: needs.changes.outputs.suite == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Songsmith EQ's installer
        uses: actions/download-artifact@v4
        with:
          name: Songsmith-EQ-macOS-pkg
          path: suite/eq

      - name: Download Songsmith Analog Compressor's installer
        uses: actions/download-artifact@v4
        with:
          name: Songsmith-Analog-Compressor-macOS-pkg
          path: suite/fet

      - name: Download Songsmith Maximiser's installer
        uses: actions/download-artifact@v4
        with:
          name: Songsmith-Maximiser-macOS-pkg
          path: suite/max

      - name: Build and test the suite installer
        shell: bash
        run: |
          eq_pkg=$(ls suite/eq/*-macOS.pkg | head -n 1)
          fet_pkg=$(ls suite/fet/*-macOS.pkg | head -n 1)
          max_pkg=$(ls suite/max/*-macOS.pkg | head -n 1)
          pkg=$(installer/macos/build-installer.sh --eq-pkg "$eq_pkg" --fet-pkg "$fet_pkg" --max-pkg "$max_pkg" | tail -n 1)
          installer/macos/test-installer.sh --i-know-this-installs-system-wide \
              --pkg "$pkg" --eq-pkg "$eq_pkg" --fet-pkg "$fet_pkg" --max-pkg "$max_pkg"

      - name: Upload the suite installer
        uses: actions/upload-artifact@v4
        with:
          name: Songsmith-Plugins-macOS-pkg
          path: build/suite-installer/*-macOS.pkg
